<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thom_OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="os">
        <header class="bar-menu">
            <div class="menu">
                <button class="button-menu">logo</button>
                <ul class="dropdown-menu">
                    <div class="dropdown-section">
                        <li class="menu-option unavailable">annuler</li>
                        <li class="menu-option unavailable">rétablir</li>
                    </div>
                    <div class="dropdown-section">
                        <li class="menu-option unavailable">couper</li>
                        <li class="menu-option unavailable">copier</li>
                        <li class="menu-option unavailable">coller</li>
                    </div>
                </ul>
            </div>

            <div class="menu">
                <button class="button-menu">Fichiers</button>
                <ul class="dropdown-menu">
                    <div class="dropdown-section">
                        <li class="menu-option checked">en icônes</li>
                        <li class="menu-option unavailable">en boutons</li>
                    </div>
                    <div class="dropdown-section">
                        <li class="menu-option checked">en fenêtre</li>
                        <li class="menu-option unavailable">options d'affichage...</li>
                    </div>
                </ul>
            </div>

            <div class="menu">
                <button class="button-menu">Édition</button>
                <ul class="dropdown-menu">
                    <div class="dropdown-section">
                        <li class="menu-option unavailable">annuler</li>
                        <li class="menu-option unavailable">rétablir</li>
                    </div>
                    <div class="dropdown-section">
                        <li class="menu-option unavailable">couper</li>
                        <li class="menu-option unavailable">copier</li>
                        <li class="menu-option unavailable">coller</li>
                    </div>
                </ul>
            </div>

            <div class="menu">
                <button class="button-menu">vue</button>
                <ul class="dropdown-menu">
                    <div class="dropdown-section">
                        <li class="menu-option unavailable">annuler</li>
                        <li class="menu-option unavailable">rétablir</li>
                    </div>
                    <div class="dropdown-section">
                        <li class="menu-option unavailable">couper</li>
                        <li class="menu-option unavailable">copier</li>
                        <li class="menu-option unavailable">coller</li>
                    </div>
                </ul>
            </div>

        <span class="gap"></span>
        <span class="clock">00:00</span>
    </header>


    <main class="desktop" id="desktop">


        <div class="item-section">
        <button class="item" data-window="about">
          <img class="item-icon" src="assets/icons_32x32/text_file.png" alt="">
          <span class="item-label">À propos</span>
        </button>


        <button class="item" data-window="projets">
          <img class="item-icon" src="assets/icons_32x32/text_file.png" alt="">
          <span class="item-label">Projets</span>
        </button>
        </div>
    </main>
    </div>

<script src="script.js"></script>

</html>
