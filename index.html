<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thom_OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="os">
        <header class="bar-menu">
            <div class="menu">
                <button class="button-menu">logo</button>
                <div class="dropdown-menu">
                    <div class="dropdown-section">
                        <div class="menu-option unavailable">annuler</div>
                        <div class="menu-option unavailable">rétablir</div>
                    </div>
                    <div class="dropdown-section">
                        <div class="menu-option unavailable">couper</div>
                        <div class="menu-option unavailable">copier</div>
                        <div class="menu-option unavailable">coller</div>
                    </div>
                </div>
            </div>

            <div class="menu">
                <button class="button-menu">Fichiers</button>
                <div class="dropdown-menu">
                    <div class="dropdown-section">
                        <div class="menu-option checked">en icônes</div>
                        <div class="menu-option unavailable">en boutons</div>
                    </div>
                    <div class="dropdown-section">
                        <div class="menu-option checked">en fenêtre</div>
                        <div class="menu-option unavailable">options d'affichage...</div>
                    </div>
                </div>
            </div>

            <div class="menu">
                <button class="button-menu">Édition</button>
                <div class="dropdown-menu">
                    <div class="dropdown-section">
                        <div class="menu-option unavailable">annuler</div>
                        <div class="menu-option unavailable">rétablir</div>
                    </div>
                    <div class="dropdown-section">
                        <div class="menu-option unavailable">couper</div>
                        <div class="menu-option unavailable">copier</div>
                        <div class="menu-option unavailable">coller</div>
                    </div>
                </div>
            </div>

            <div class="menu">
                <button class="button-menu">vue</button>
                <div class="dropdown-menu">
                    <div class="dropdown-section">
                        <div class="menu-option unavailable">annuler</div>
                        <div class="menu-option unavailable">rétablir</div>
                    </div>
                    <div class="dropdown-section">
                        <div class="menu-option unavailable">couper</div>
                        <div class="menu-option unavailable">copier</div>
                        <div class="menu-option unavailable">coller</div>
                    </div>
                </div>
            </div>

        <span class="gap"></span>
        <span class="clock">00:00</span>
    </header>       


    <main class="desktop" id="desktop">


        <div class="item-section">
        <button class="item" data-window="about">
          <img class="item-icon" src="assets/icons_32x32/text_file.png" alt="">
          <span class="item-label">À propos</span>
        </button>


        <button class="item" data-window="projets">
          <img class="item-icon" src="assets/icons_32x32/text_file.png" alt="">
          <span class="item-label">Projets</span>
        </button>
        </div>
    </main>
    </div>

    <section class="window" id="about" aria-labelledby="about-title">
        <div class="titlebar">
            <span class="window-title" id="about-title">À propos</span>
            <button class="close-button" aria-label="Fermer">×</button>
        </div>
        <div class="window-content">
            <div class="document">
                <h1>À propos de moi</h1>
                <p>Bienvenue sur mon portfolio !</p>
            </div>
        </div>
    </section>

<script src="script.js"></script>
</body>
</html>
